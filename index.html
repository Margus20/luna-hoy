<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna Hoy · fase actual de la Luna</title>
<style>
  :root{
    --bg:#05070f; --card:#0d1224; --ink:#eaf0ff; --muted:#9fb0d8;
    --accent:#f5d76e; --line:#243056;
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink); min-height:100vh;
    background:radial-gradient(1200px 700px at 50% -10%, #13224d 0%, var(--bg) 62%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .app{max-width:1400px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:14px}

  header.top{text-align:center; border-bottom:1px solid var(--line); padding-bottom:14px}
  .kicker{font-size:clamp(13px,2.1vw,20px); letter-spacing:.34em; text-transform:uppercase; color:var(--muted); margin:0 0 6px}
  #phaseName{
    font-size:clamp(40px,9vw,112px); line-height:.95; margin:0; font-weight:800;
    text-transform:uppercase; letter-spacing:.01em;
    background:linear-gradient(180deg,#ffffff,#a9c3ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 45px rgba(120,160,255,.25);
  }
  #illumTag{margin:10px 0 0; color:var(--accent); font-size:clamp(16px,2.8vw,26px); font-weight:600}

  main.grid{display:grid; grid-template-columns:1fr minmax(260px,46%) 1fr; gap:14px; align-items:start}
  aside.panel{background:rgba(13,18,36,.72); border:1px solid var(--line); border-radius:18px; padding:14px}
  aside.panel h2{margin:0 0 10px; font-size:15px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted)}
  .slot{display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line); font-size:clamp(14px,1.8vw,18px)}
  .slot:last-child{border-bottom:0}
  .slot b{color:#cfe0ff; font-weight:600}
  .slot span{color:var(--accent); font-weight:700; text-align:right}

  section.stage{display:flex; flex-direction:column; align-items:center; gap:12px; padding:10px}
  #moonWrap{position:relative; width:min(52vh,420px); aspect-ratio:1/1; border-radius:50%;
    background:#0a0f1e; box-shadow:0 0 70px rgba(140,180,255,.18), inset 0 0 40px rgba(0,0,0,.8);
    display:flex; align-items:center; justify-content:center; overflow:hidden}
  #moonCanvas{width:100%; height:100%; display:block; border-radius:50%}
  #clock{color:var(--muted); font-size:clamp(13px,1.9vw,17px); text-align:center}

  footer{color:#7a8bb5; font-size:14px; text-align:center; padding:10px 0 18px; letter-spacing:.05em}
  footer .heart{color:#ff6b8a; animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

  @media (max-width:820px){
    main.grid{grid-template-columns:1fr 1fr}
    section.stage{grid-column:1/-1; order:-1}
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <p class="kicker">Luna Hoy · observación en vivo</p>
    <h1 id="phaseName">Fase lunar</h1>
    <p id="illumTag">calculando...</p>
  </header>

  <main class="grid">
    <aside class="panel" id="left">
      <h2>Ciclo</h2>
      <div class="slot"><b>Edad lunar</b><span id="age">—</span></div>
      <div class="slot"><b>Luz</b><span id="trend">—</span></div>
      <div class="slot"><b>Próxima fase</b><span id="next">—</span></div>
      <div class="slot"><b>Faltan</b><span id="countdown">—</span></div>
    </aside>

    <section class="stage">
      <div id="moonWrap">
        <canvas id="moonCanvas" width="420" height="420"></canvas>
      </div>
      <p id="clock">hora local: —</p>
    </section>

    <aside class="panel" id="right">
      <h2>Cielo</h2>
      <div class="slot"><b>Iluminación</b><span id="illum">—</span></div>
      <div class="slot"><b>Distancia</b><span id="dist">—</span></div>
      <div class="slot"><b>Salida</b><span id="rise">—</span></div>
      <div class="slot"><b>Puesta</b><span id="set">—</span></div>
      <div class="slot"><b>Constelación</b><span id="constellation">—</span></div>
      <div class="slot"><b>Tip</b><span id="tip">—</span></div>
    </aside>
  </main>

  <footer>Hecho con amor por <b>Margus20</b> <span class="heart">❤️</span></footer>
</div>

<script>
/* ============================================================
   MOTOR ASTRONÓMICO DE FASE LUNAR
   ============================================================ */
const SYNODIC_MONTH = 29.530588853;
const REF_NEW_MOON = Date.UTC(2000, 0, 6, 18, 14, 0);

function moonAge(now = Date.now()) {
  const daysSinceRef = (now - REF_NEW_MOON) / 86400000;
  let age = daysSinceRef % SYNODIC_MONTH;
  if (age < 0) age += SYNODIC_MONTH;
  return age;
}
function moonPhase(now = Date.now()) { return moonAge(now) / SYNODIC_MONTH; }
function illumination(phase) { return (1 - Math.cos(2 * Math.PI * phase)) / 2 * 100; }

function phaseName(phase) {
  if (phase < 0.03125 || phase >= 0.96875) return "Luna Nueva";
  if (phase < 0.21875) return "Creciente Córnica";
  if (phase < 0.28125) return "Cuarto Creciente";
  if (phase < 0.46875) return "Gibosa Creciente";
  if (phase < 0.53125) return "Luna Llena";
  if (phase < 0.71875) return "Gibosa Menguante";
  if (phase < 0.78125) return "Cuarto Menguante";
  return "Menguante Córnica";
}
function trend(phase) {
  if (phase < 0.5) return "Creciente 🌒";
  if (phase > 0.5) return "Menguante 🌖";
  return "Llena 🌕";
}
function nextPhaseInfo(phase) {
  const phases = [
    { name: "Luna Nueva", target: 0 },
    { name: "Cuarto Creciente", target: 0.25 },
    { name: "Luna Llena", target: 0.5 },
    { name: "Cuarto Menguante", target: 0.75 }
  ];
  for (const p of phases) {
    if (p.target > phase + 0.001) {
      const daysLeft = (p.target - phase) * SYNODIC_MONTH;
      return { name: p.name, days: daysLeft };
    }
  }
  const daysLeft = (1 - phase) * SYNODIC_MONTH;
  return { name: "Luna Nueva", days: daysLeft };
}
function formatCountdown(days) {
  const d = Math.floor(days);
  const h = Math.floor((days - d) * 24);
  const m = Math.floor(((days - d) * 24 - h) * 60);
  if (d > 0) return `${d}d ${h}h ${m}m`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}
function distanceKm(phase) {
  const anomaly = 2 * Math.PI * phase;
  return Math.round(384400 + 25100 * Math.cos(anomaly));
}
function constellationForPhase(phase) {
  const degrees = (phase * 360 + 280) % 360;
  const signs = [
    { name: "Capricornio ♑", min: 270 }, { name: "Acuario ♒", min: 300 },
    { name: "Piscis ♓", min: 330 }, { name: "Aries ♈", min: 0 },
    { name: "Tauro ♉", min: 30 }, { name: "Géminis ♊", min: 60 },
    { name: "Cáncer ♋", min: 90 }, { name: "Leo ♌", min: 120 },
    { name: "Virgo ♍", min: 150 }, { name: "Libra ♎", min: 180 },
    { name: "Escorpio ♏", min: 210 }, { name: "Sagitario ♐", min: 240 }
  ];
  for (let i = signs.length - 1; i >= 0; i--) {
    if (degrees >= signs[i].min) return signs[i].name;
  }
  return signs[0].name;
}
function observationTip(phase) {
  if (phase < 0.03 || phase > 0.97) return "Cielo oscuro ideal para estrellas y Vía Láctea.";
  if (phase < 0.25) return "Buen momento para ver cráteres cerca del terminador.";
  if (phase < 0.5) return "Cuarto creciente: sombras largas, gran detalle lunar.";
  if (phase < 0.53) return "¡Luna llena! Perfecta para fotografía, pero poco relieve.";
  if (phase < 0.75) return "Gibosa menguante: buena para observar mares lunares.";
  if (phase < 0.78) return "Cuarto menguante: salida cerca de la medianoche.";
  return "Menguante: mejor observación antes del amanecer.";
}
function updateClock() {
  const now = new Date();
  const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
                 hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
  document.getElementById('clock').textContent = 'hora local: ' + now.toLocaleDateString('es-VE', opts);
}

/* ============================================================
   DIBUJO DE LA LUNA EN EL CANVAS
   ============================================================ */
const canvas = document.getElementById('moonCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const CX = W / 2, CY = H / 2, R = W / 2 - 10;

// Cráteres procedurales (posición normalizada x,y entre -1 y 1, radio normalizado)
const craters = [
  { x: -0.35, y: -0.25, r: 0.18, name: "Mare Imbrium" },
  { x: 0.15, y: -0.30, r: 0.15, name: "Mare Serenitatis" },
  { x: 0.40, y: -0.10, r: 0.12, name: "Mare Crisium" },
  { x: -0.10, y: 0.10, r: 0.22, name: "Mare Tranquillitatis" },
  { x: 0.25, y: 0.20, r: 0.14, name: "Mare Fecunditatis" },
  { x: -0.40, y: 0.30, r: 0.16, name: "Mare Nubium" },
  { x: 0.05, y: 0.35, r: 0.13, name: "Mare Nectaris" },
  { x: -0.20, y: -0.50, r: 0.10, name: "Mare Frigoris" },
  { x: 0.30, y: -0.45, r: 0.09, name: "Mare Humboldtianum" },
  { x: -0.50, y: 0.05, r: 0.11, name: "Oceanus Procellarum" },
  { x: 0.00, y: -0.05, r: 0.08, name: "Sinus Medii" },
  { x: -0.15, y: 0.45, r: 0.07, name: "Mare Humorum" },
  { x: 0.45, y: 0.40, r: 0.06, name: "Mare Australe" },
  { x: -0.55, y: -0.35, r: 0.05, name: "Mare Insularum" },
  { x: 0.20, y: 0.50, r: 0.05, name: "Mare Smythii" }
];
// Cráteres pequeños de impacto
const smallCraters = [];
for (let i = 0; i < 80; i++) {
  const angle = Math.random() * Math.PI * 2;
  const rad = Math.random() * 0.85;
  smallCraters.push({
    x: Math.cos(angle) * rad,
    y: Math.sin(angle) * rad,
    r: 0.01 + Math.random() * 0.03
  });
}

function drawMoon(phase) {
  ctx.clearRect(0, 0, W, H);
  
  // Fase: 0 = nueva, 0.5 = llena, 1 = nueva
  // El terminador se mueve de derecha a izquierda en el hemisferio norte
  // phase 0-0.5: creciente (iluminado a la derecha)
  // phase 0.5-1: menguante (iluminado a la izquierda)
  
  const isWaxing = phase < 0.5;
  const halfPhase = isWaxing ? phase * 2 : (1 - phase) * 2; // 0 a 1 dentro de cada mitad
  // halfPhase: 0 = nueva, 1 = llena (dentro de la mitad actual)
  
  // 1. Fondo oscuro de la Luna (parte no iluminada)
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.fillStyle = '#1a1f2e';
  ctx.fill();
  
  // 2. Dibujar cráteres en la parte oscura (tenues, luz cenicienta)
  drawCraters(0.15);
  
  // 3. Parte iluminada
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.clip();
  
  // La forma iluminada depende de la fase
  // Usamos una elipse para el terminador
  const terminatorX = CX + (isWaxing ? 1 : -1) * R * Math.cos(halfPhase * Math.PI);
  
  ctx.beginPath();
  if (halfPhase < 0.5) {
    // Menos de medio iluminado: forma de "C" o "D" delgada
    if (isWaxing) {
      ctx.arc(CX, CY, R, -Math.PI/2, Math.PI/2, false);
      ctx.ellipse(CX, CY, R * Math.cos(halfPhase * Math.PI), R, 0, Math.PI/2, -Math.PI/2, true);
    } else {
      ctx.arc(CX, CY, R, Math.PI/2, -Math.PI/2, false);
      ctx.ellipse(CX, CY, R * Math.cos(halfPhase * Math.PI), R, 0, -Math.PI/2, Math.PI/2, true);
    }
  } else {
    // Más de medio iluminado
    if (isWaxing) {
      ctx.arc(CX, CY, R, -Math.PI/2, Math.PI/2, false);
      ctx.ellipse(CX, CY, R * Math.abs(Math.cos(halfPhase * Math.PI)), R, 0, Math.PI/2, -Math.PI/2, false);
    } else {
      ctx.arc(CX, CY, R, Math.PI/2, -Math.PI/2, false);
      ctx.ellipse(CX, CY, R * Math.abs(Math.cos(halfPhase * Math.PI)), R, 0, -Math.PI/2, Math.PI/2, false);
    }
  }
  ctx.closePath();
  
  // Gradiente de iluminación (más brillante en el centro del lado iluminado)
  const grad = ctx.createRadialGradient(
    CX + (isWaxing ? R*0.3 : -R*0.3), CY, R*0.1,
    CX, CY, R
  );
  grad.addColorStop(0, '#fffef5');
  grad.addColorStop(0.5, '#f0ead6');
  grad.addColorStop(1, '#d4c9a8');
  ctx.fillStyle = grad;
  ctx.fill();
  
  // 4. Cráteres en la parte iluminada (visibles)
  drawCraters(0.6);
  
  ctx.restore();
  
  // 5. Borde suave y sombra exterior
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(200,210,230,0.15)';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // Resplandor exterior
  const glow = ctx.createRadialGradient(CX, CY, R*0.9, CX, CY, R*1.3);
  glow.addColorStop(0, 'rgba(200,220,255,0.08)');
  glow.addColorStop(1, 'rgba(200,220,255,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
}

function drawCraters(opacity) {
  // Mares lunares (manchas oscuras grandes)
  craters.forEach(c => {
    const px = CX + c.x * R;
    const py = CY + c.y * R;
    const pr = c.r * R;
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(80,85,100,${opacity * 0.5})`;
    ctx.fill();
  });
  // Cráteres pequeños
  smallCraters.forEach(c => {
    const px = CX + c.x * R;
    const py = CY + c.y * R;
    const pr = c.r * R;
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(60,65,80,${opacity * 0.4})`;
    ctx.fill();
    // Borde del cráter (luz)
    ctx.beginPath();
    ctx.arc(px - pr*0.2, py - pr*0.2, pr*0.9, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180,185,200,${opacity * 0.15})`;
    ctx.fill();
  });
}

function updateAll() {
  const now = Date.now();
  const age = moonAge(now);
  const phase = moonPhase(now);
  const illum = illumination(phase);
  const name = phaseName(phase);
  const tr = trend(phase);
  const next = nextPhaseInfo(phase);
  const dist = distanceKm(phase);
  const cons = constellationForPhase(phase);
  const tip = observationTip(phase);

  document.getElementById('phaseName').textContent = name;
  document.getElementById('illumTag').textContent = illum.toFixed(1) + '% iluminada · ' + tr;
  document.getElementById('age').textContent = age.toFixed(2) + ' días';
  document.getElementById('trend').textContent = tr;
  document.getElementById('next').textContent = next.name;
  document.getElementById('countdown').textContent = formatCountdown(next.days);
  document.getElementById('illum').textContent = illum.toFixed(1) + '%';
  document.getElementById('dist').textContent = dist.toLocaleString('es') + ' km';
  document.getElementById('constellation').textContent = cons;
  document.getElementById('tip').textContent = tip;

  drawMoon(phase);
  updateClock();
}

updateAll();
setInterval(updateAll, 1000);
</script>
</body>
</html>
